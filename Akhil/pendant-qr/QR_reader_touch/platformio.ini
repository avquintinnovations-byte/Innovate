; PlatformIO Project Configuration File
; Seeed Studio XIAO ESP32-S3 Sense + Round Display (live camera)
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; TFT_eSPI for Round Display (GC9A01 240x240)
; ESP32QRCodeReader for QR decode
lib_deps = 
    https://github.com/Seeed-Projects/SeeedStudio_TFT_eSPI.git
    alvarowolfx/ESP32QRCodeReader

; PSRAM + quirc include path + larger loop stack (quirc needs ~12KB+)
build_flags = 
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_XIAO_ESP32S3
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/ESP32QRCodeReader/src
    -DARDUINO_LOOP_STACK_SIZE=16384
