; ============================================================
; PlatformIO project for XIAO ESP32S3 Sense + Seeed Round Display
; Migrated from Arduino IDE (ESP32 board manager 2.0.9)
; ============================================================

[platformio]
; Source files (.ino / .h) live in the same folder as platformio.ini
src_dir = .

[env:seeed_xiao_esp32s3]
platform = espressif32 @ 6.2.0
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Use the 8 MB partition layout (XIAO ESP32S3 has 8 MB flash)
board_build.partitions = default_8MB.csv

; Enable the OPI PSRAM on XIAO ESP32S3 Sense
board_build.arduino.memory_type = qio_opi

build_flags =
    ; --- USB-CDC serial (required for USB serial monitor on XIAO ESP32S3) ---
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; --- QR scanner (quirc needs larger loop stack ~12KB+) ---
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/ESP32QRCodeReader/src

    ; ----------------------------------------------------------------
    ; TFT_eSPI — GC9A01 driver for Seeed Round Display on XIAO ESP32S3
    ;
    ; XIAO ESP32S3 GPIO mapping used by Round Display:
    ;   TFT_CS  = D1  → GPIO 2
    ;   TFT_DC  = D3  → GPIO 4
    ;   TFT_RST = not connected → -1
    ;   SCK     = D8  → GPIO 7
    ;   MOSI    = D10 → GPIO 9
    ;   MISO    = D9  → GPIO 8
    ;
    ; Reference: https://wiki.seeedstudio.com/seeedstudio_round_display_usage/
    ; ----------------------------------------------------------------
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=9
    -D TFT_SCLK=7
    -D TFT_CS=2
    -D TFT_DC=4
    -D TFT_MISO=8
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000

lib_deps =
    ; TFT display driver (GC9A01 round display)
    bodmer/TFT_eSPI @ ^2.5.43

    ; BLE — pin to 1.x series; 2.x has breaking API changes
    h2zero/NimBLE-Arduino @ ^1.4.2

    ; RTC: BM8563 chip on the Seeed Round Display
    tanakamasayuki/I2C BM8563 RTC @ ^1.0.4

    ; QR code decode (quirc) - integrated from QR_reader_touch
    alvarowolfx/ESP32QRCodeReader
