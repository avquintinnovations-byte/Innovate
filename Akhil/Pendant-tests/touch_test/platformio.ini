; PlatformIO Project Configuration File
; For XIAO ESP32S3 + Round Display (240x240 GC9A01)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Use round display + touch (GC9A01 + CHSC6X) - enables tft.getTouch()
build_flags = -DBOARD_SCREEN_COMBO=501

; Seeed_GFX library for TFT display (includes TFT_eSPI for XIAO Round Display)
; Install from GitHub (Seeed_GFX is not in PlatformIO registry)
lib_deps = 
    https://github.com/Seeed-Studio/Seeed_GFX.git

; Note: XIAO ESP32S3 and XIAO ESP32S3 Sense both use board = seeed_xiao_esp32s3
