; PlatformIO - XIAO ESP32S3 Sense QR Reader
; If Serial shows nothing: try upload, then monitor, then press RESET

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Upload - use upload_port if board not auto-detected
; upload_port = COM9

; Enable PSRAM (required for camera)
board_build.arduino.psram_type = opi

lib_deps =
    alvarowolfx/ESP32QRCodeReader
    bodmer/TFT_eSPI @ ^2.5.0

; USB CDC=1: Serial over USB (default). If nothing shows, try CDC=0 in env below
build_flags =
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -I$PROJECT_DIR/include
    -include $PROJECT_DIR/include/TFT_Setup_RoundDisplay.h

; Alternate: use UART if USB CDC shows nothing (needs FTDI on TX/RX pins)
[env:seeed_xiao_esp32s3_uart]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.psram_type = opi
lib_deps =
    alvarowolfx/ESP32QRCodeReader
    bodmer/TFT_eSPI @ ^2.5.0
build_flags =
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -I$PROJECT_DIR/include
    -include $PROJECT_DIR/include/TFT_Setup_RoundDisplay.h
